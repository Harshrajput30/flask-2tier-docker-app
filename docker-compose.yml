version: '3'

services:
  web:
    build: .
    image: harshrajputt/two-tier-flask-app   # ✅ inside web
    container_name: flask-app
    ports:
      - "5000:5000"
    depends_on:
      - db
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DB: flask_db


db:
  image: mysql:5.7
  container_name: mysql-db
  restart: always
  command: --default-authentication-plugin=mysql_native_password   # ✅ ADD THIS
  environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: flask_db
  ports:
    - "3306:3306"
  volumes:
    - ./message.sql:/docker-entrypoint-initdb.d/message.sql
